<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paperweave</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20242b;font:14px 'Segoe UI','Microsoft YaHei UI',sans-serif;display:grid;place-items:center;height:100vh}.welcome{max-width:420px;padding:40px}svg{color:#3568d4}h1{font-size:28px;letter-spacing:-1px;margin:24px 0 12px}p{line-height:1.8;color:#69717e}button{border:1px solid #d3d8e0;border-radius:7px;padding:10px 16px;background:white;color:#20242b;cursor:pointer}button:first-of-type{background:#20242b;color:white;border-color:#20242b}#error{white-space:pre-wrap;color:#ae453f;font-size:12px}button:disabled{opacity:.5;cursor:wait}
</style></head><body><main class="welcome"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg><h1>Paperweave</h1><p id="status">正在打开研究工作台…</p><div id="error" role="alert"></div><button id="retry">重新打开</button> <button id="project">打开研究目录</button></main><script>
const invoke = (...args) => window.__TAURI__.core.invoke(...args);
async function launch(command){document.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelector('#error').textContent='';try{await invoke(command)}catch(e){document.querySelector('#status').textContent='工作台暂时无法启动';document.querySelector('#error').textContent=String(e)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelector('#retry').onclick=()=>launch('launch_default');document.querySelector('#project').onclick=()=>launch('open_project');launch('launch_default');
</script></body></html>
