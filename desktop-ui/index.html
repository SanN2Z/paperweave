<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>扇子</title><link rel="icon" href="fan-sprite.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f6;color:#282b2f;font:14px 'Segoe UI Variable','Segoe UI','Microsoft YaHei UI',sans-serif;display:grid;place-items:center;min-height:100vh;border:1px solid #e3e4e2}
.welcome{max-width:460px;padding:32px;text-align:center}.mascot{width:92px;height:92px;object-fit:contain}h1{font-size:27px;font-weight:600;letter-spacing:-.8px;margin:17px 0 8px}p{line-height:1.8;color:#76787b;margin:0 0 23px}.actions{display:flex;justify-content:center;gap:10px}button{border:1px solid #dcdedc;border-radius:8px;padding:10px 16px;background:#fff;color:#34373b;cursor:pointer;font:inherit;box-shadow:0 1px 2px #20242805}button:first-of-type{background:#303338;color:#fff;border-color:#303338}button:hover{filter:brightness(.96)}button:focus-visible{outline:2px solid #3568d4;outline-offset:3px}#error{white-space:pre-wrap;overflow-wrap:anywhere;color:#a3483b;font-size:12px;max-height:80px;overflow:auto;margin-bottom:14px}#error:empty{display:none}button:disabled{opacity:.45;cursor:wait}.caption{margin-top:26px;color:#949693;font-size:11px;letter-spacing:.5px}
</style>
</head><body><main class="welcome">
<img class="mascot" src="fan-sprite.png" alt="小扇子精" width="92" height="92">
<h1>扇子</h1><p id="status">正在打开你的研究工作台…</p>
<div id="error" role="alert"></div>
<div class="actions"><button id="retry">重新打开</button><button id="project">打开研究目录</button></div>
<div class="caption">让每一个研究问题，都有迹可循。</div>
</main><script>
const invoke = (...args) => window.__TAURI__.core.invoke(...args);
async function launch(command){document.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelector('#error').textContent='';try{await invoke(command)}catch(e){document.querySelector('#status').textContent='工作台暂时无法启动';document.querySelector('#error').textContent=String(e)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelector('#retry').onclick=()=>launch('launch_default');document.querySelector('#project').onclick=()=>launch('open_project');launch('launch_default');
</script></body></html>
