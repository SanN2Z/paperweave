name: Windows installed app recheck
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Windows desktop build run containing the installer to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: gh run download $env:BUILD_RUN --pattern "*-windows-x64" --dir artifacts/windows-candidate
      - name: Install candidate
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts/windows-candidate -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Candidate installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'Paperweave-image-check'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          "PAPERWEAVE_DESKTOP_EXE=$destination\paperweave-desktop.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify installed WebView, images, PTY and MCP
        run: node scripts/desktop-check.js
      - name: Native runner diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'paperweave|msedgewebview' } | Select-Object ProcessName,Id,SessionId,MainWindowTitle
          Get-ChildItem -LiteralPath 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue | Select-Object Name
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path (Get-Location) 'artifacts\desktop-runner.png'))
          $graphics.Dispose()
          $bitmap.Dispose()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-validation
          path: artifacts/desktop-*.png
          if-no-files-found: ignore
