name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'desktop-ui/**', 'scripts/desktop-*.js', 'scripts/desktop-*.ps1', '.github/workflows/desktop.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run desktop:stage
      - run: node scripts/desktop-licenses.js
      - run: npm run desktop:build
      - name: Download the real 0.2.0 upgrade fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33965048076 --name Paperweave-windows-x64 --dir artifacts/legacy-installer
      - name: Verify install, uninstall and research data retention
        shell: pwsh
        run: ./scripts/desktop-installer-check.ps1
      - name: Hash installer
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          $name = "$($config.productName)_$($config.version)_x64-setup.exe"
          $installer = Get-Item -LiteralPath (Join-Path 'src-tauri/target/release/bundle/nsis' $name)
          New-Item -ItemType Directory -Force artifacts/windows-release | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination artifacts/windows-release
          (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash + '  ' + $installer.Name | Set-Content artifacts/windows-release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shanzi-windows-x64
          path: |
            artifacts/windows-release/*.exe
            artifacts/windows-release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: ignore
